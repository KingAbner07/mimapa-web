<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mi mapa. — App</title>
<meta name="theme-color" content="#F6F1EA">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --ink:#1F2421; --muted:#68625C; --line:#E7DED2;
  --brand:#1E4D45; --brand-2:#2B6A5F; --brand-soft:#E4EEEA;
  --terra:#B9532D; --terra-soft:#F6E5DB; --gold:#C99332; --gold-soft:#F7EEDB;
  --alert:#A3402A; --alert-soft:#F8E6E0;
  --shadow:0 1px 2px rgba(31,36,33,.04), 0 12px 32px -16px rgba(31,36,33,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"DM Sans",system-ui,sans-serif;font-size:16.5px;line-height:1.5;min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100dvh}
.app.withnav{padding-bottom:100px}
header.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:21px;color:var(--brand);letter-spacing:-.02em}
.logo b{color:var(--terra)}
.kid{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:14.5px}
.kid i{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
main{padding:6px 18px 24px}
.screen{animation:in .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hello{margin:8px 0 16px}
.hello small{display:block;color:var(--muted);font-weight:600;font-size:14.5px}
.hello h1{font-size:27px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);margin-bottom:8px}
.card{background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.card h2{font-size:20px;margin-bottom:4px}
.lead{color:var(--muted);font-size:14.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--brand);color:#fff;font-weight:700;font-size:16.5px;padding:16px;border-radius:14px;margin-top:16px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.terra{background:var(--terra)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.link{color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16.5px;outline:none}
.input:focus{border-color:var(--brand)}
.err{background:var(--alert-soft);color:var(--alert);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;margin:8px 0}
.ok{background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:10px 12px;font-size:14.5px;font-weight:600;margin:8px 0}
.center{text-align:center}
.auth{padding:28px 20px}
.auth h1{font-size:30px;margin:14px 0 6px}

/* opciones */
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600;text-align:left;width:100%}
.opt .em{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.food{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 4px 9px;text-align:center;font-weight:600;font-size:13px;line-height:1.2}
.food .em{display:block;font-size:24px;margin-bottom:5px}
.food.sel{border-color:var(--brand);background:var(--brand-soft)}
.food.try{border-color:var(--gold);background:var(--gold-soft)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}

/* semana */
.weekhead{display:flex;align-items:center;gap:14px}
.weekhead b{display:block;font-size:16.5px}
.shop{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:12px;border-radius:12px;background:var(--gold-soft);color:#5E4A20;font-weight:700;font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--muted)}
.day b{font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--ink)}
.day i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.day.full i{background:var(--brand)}.day.part i{background:var(--gold)}
.day.sel{background:var(--brand);border-color:var(--brand);color:#cfe0db}
.day.sel b{color:#fff}
.day.today:not(.sel){border-color:var(--terra)}
.dayttl{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 10px;gap:8px}
.dayttl h2{font-size:21px}
.dayttl span{font-weight:600;color:var(--muted);font-size:13.5px;text-align:right}
.meal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.meal.has-new{border:1.5px solid var(--terra)}
.mtop{display:flex;justify-content:space-between;align-items:center}
.mname{font-weight:700;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chg{font-weight:700;font-size:13.5px;color:var(--brand);padding:4px 8px;border-radius:10px}
.plate{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.it{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:600;font-size:14.5px}
.it.new{background:var(--terra-soft);color:#7E3519;border:1.5px dashed var(--terra);cursor:pointer}
.it.new small{font-size:10.5px;font-weight:700;text-transform:uppercase;background:var(--terra);color:#fff;border-radius:6px;padding:1px 5px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three button{padding:10px 2px;border-radius:12px;font-weight:700;font-size:14px;border:2px solid transparent}
.three .t1{background:var(--brand-soft);color:var(--brand)}
.three .t2{background:var(--gold-soft);color:#7A5A12}
.three .t3{background:#F0EBE5;color:var(--muted)}
.three button.sel{border-color:currentColor}
.three.answered button:not(.sel){opacity:.35}
.lbl2{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.newrow{display:flex;gap:10px;background:var(--terra-soft);border:1.5px dashed var(--terra);border-radius:14px;padding:10px 12px;cursor:pointer;margin-top:4px}
.newrow .plus{font-size:20px;font-weight:700;color:var(--terra);line-height:1.2}
.newrow small{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--terra)}
.newrow b{display:block;font-size:16px;color:#7E3519;margin:2px 0}
.newrow em{display:block;font-style:normal;font-size:13px;color:#6b4a3c;line-height:1.35}
.newrow u,.todaynew u{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--terra);text-decoration:none}
.todaynew{display:flex;gap:12px;align-items:flex-start;background:var(--terra);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer}
.todaynew .em{font-size:36px;line-height:1}
.todaynew small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.todaynew b{display:block;font-family:Fraunces,serif;font-size:20px;margin:2px 0 4px}
.todaynew span{display:block;font-size:13.5px;line-height:1.4;opacity:.95}
.todaynew u{color:#fff}
.stats{display:flex;align-items:center;gap:14px;margin:10px 0 6px}
.stats div{text-align:center}.stats b{display:block;font-family:Fraunces,serif;font-size:34px;font-weight:600;line-height:1}
.stats small{font-size:12px;font-weight:700;opacity:.85}.stats .arr{font-size:22px;opacity:.7}.stats .now b{color:#F3C9B6}
.weeknew{margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}.weeknew span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;opacity:.8}.weeknew b{font-size:14.5px}
.tip{font-size:13px;color:var(--muted);font-weight:600;margin-top:8px}

/* avance */
.hero{background:var(--brand);color:#fff;border:0}
.hero .eyebrow{color:#F3C9B6}
.hero h2{font-size:23px}
.hero p{opacity:.88;font-size:14.5px;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;margin-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars b{font-family:Fraunces,serif;font-weight:600;font-size:17px}
.bars span{display:block;width:100%;border-radius:8px 8px 3px 3px;background:rgba(255,255,255,.25)}
.bars div.now span{background:#F3C9B6}
.bars small{font-size:11.5px;font-weight:700;opacity:.85}
.nutri{display:grid;gap:14px;margin-top:14px}
.nrow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}
.nrow .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--bg)}
.nrow b{display:block;font-size:15.5px}
.nrow small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.track{height:7px;background:#EEE7DE;border-radius:99px;margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--brand-2)}
.delta{font-family:Fraunces,serif;font-weight:600;font-size:16px;color:var(--brand);white-space:nowrap}
.delta.flat{color:var(--muted)}
.swap{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px dashed var(--line)}
.swap:first-of-type{border-top:0}
.swap .f{display:flex;flex-direction:column;align-items:center;width:76px;text-align:center;font-size:12px;font-weight:600;line-height:1.2}
.swap .f span{font-size:26px}
.swap .from{opacity:.55;text-decoration:line-through}
.swap .arrow{color:var(--terra);font-weight:700;font-size:18px}
.swap .gain{flex:1;font-size:13.5px;font-weight:600;color:var(--brand)}
.empty{color:var(--muted);font-size:14.5px;margin-top:8px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 8px 18px;line-height:1.4}
.pill{font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:99px}
.p-ok{background:var(--brand-soft);color:var(--brand)}.p-try{background:var(--gold-soft);color:#7A5A12}.p-no{background:#F0EBE5;color:var(--muted)}
.group-h{display:flex;justify-content:space-between;align-items:baseline}
.rows{display:grid;gap:10px;font-size:15px;margin-top:10px}
.rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.rows div:last-child{border:0;padding:0}
.rows b{font-weight:700;text-align:right}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12.5px;color:var(--muted);padding:4px 0}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}

/* hojas */
.backdrop{position:fixed;inset:0;background:rgba(31,36,33,.4);z-index:30;opacity:0;pointer-events:none;transition:.25s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:86dvh;overflow:auto}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:21px;margin-bottom:4px}
.howbox{background:#fff;border-radius:14px;padding:14px;margin-top:14px;font-size:15px}
.howbox ol{padding-left:20px;display:grid;gap:5px;margin-top:6px}
.because{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;padding:4px 10px;border-radius:99px;margin-top:6px}
.plus{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.plus span{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px;padding:5px 11px;border-radius:99px}
.shoplist{display:grid;gap:8px;margin-top:12px}
.shoplist label{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600}
.shoplist input{width:20px;height:20px;accent-color:var(--brand)}
.shoplist label:has(input:checked){opacity:.5;text-decoration:line-through}
.alts{display:grid;gap:10px;margin-top:12px}
.alts button{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.celebrate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(31,36,33,.45);opacity:0;pointer-events:none;transition:.25s}
.celebrate.show{opacity:1;pointer-events:auto}
.celebrate .box{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:330px;margin:16px}
.celebrate .big{font-size:52px}
.toast{position:fixed;left:50%;bottom:108px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:600;font-size:14.5px;padding:11px 16px;border-radius:99px;opacity:0;transition:.3s;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loader{display:grid;place-items:center;min-height:70dvh;color:var(--muted);font-weight:600}
.demo{font-size:12px;text-align:center;padding:5px;background:var(--gold-soft);color:#5E4A20;font-weight:700}
</style>
</head>
<body>
<div id="demoBar"></div>
<div class="app" id="root"><div class="loader">Cargando…</div></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="celebrate" id="celebrate"></div>
<div class="toast" id="toast"></div>

/* =========================================================
   Motor: alimentos, puentes, menú y nutrientes
   ========================================================= */
const ALL = {};
FOODS.forEach(f => ALL[f.id] = {id:f.id, n:f.n, e:f.e, g:f.g||[], slots:SLOTS_OF[f.id]||["com"], alg:ALG_OF[f.id]||[], shop:SHOP_OF[f.id]||[f.n], up:!!UP_OF[f.id]});
BRIDGES.forEach(b => ALL[b.id] = {id:b.id, n:SHORT_OF[b.id]||b.to, e:b.e, g:b.nut||[], slots:SLOTS_OF[b.id]||["com"], alg:ALG_OF[b.id]||[], shop:SHOP_OF[b.id]||[], bridge:b});
const NUM = id => { const g=ALL[id]?.g||[]; return {fibra:g.includes("fibra")?2:0, prot:g.includes("prot")?2:0, hierro:g.includes("hierro")?2:0, calcio:g.includes("calcio")?2:0, vitA:g.includes("vitA")?2:0}; };
const allergic = id => (ALL[id]?.alg||[]).some(a => (S.profile?.allergies||[]).includes(a));
const status = id => S.profile?.status?.[id] || "no";

function pickBridges(p){
  const safe = Object.keys(p.status||{}).filter(id=>p.status[id]==="ok");
  const has = grp => safe.some(id=>(ALL[id]?.g||[]).includes(grp));
  const gaps = ["hierro","calcio","vitA","fibra","verdura"].filter(x=>!has(x));
  const cand = BRIDGES.filter(b => p.status[b.id]!=="ok" && !(ALG_OF[b.id]||[]).some(a=>(p.allergies||[]).includes(a)))
    .map(b => { const anchor=b.from.find(id=>safe.includes(id)); if(!anchor) return null;
      let s=10 + (b.nut||[]).filter(n=>gaps.includes(n)).length*6 + (p.status[b.id]==="try"?8:0) - (b.id==="papas-horno"?3:0);
      return {id:b.id, anchor, s}; }).filter(Boolean).sort((a,b)=>b.s-a.s);
  return cand.slice(0,3);
}
function genMenu(p){
  const safe = Object.keys(p.status||{}).filter(id=>p.status[id]==="ok" && ALL[id]);
  const bridges = pickBridges(p);
  const bySlot = sl => { const l=safe.filter(id=>ALL[id].slots.includes(sl)); return l.length?l:safe; };
  const menu = {}, rot = {des:0,com:0,col:0,cen:0}; const startDay = todayIdx();
  for (let d=0; d<7; d++){
    const day = {};
    for (const [sl] of SLOTS){
      const pool = bySlot(sl); const n = sl==="col"?1:2; const plate=[];
      for (let k=0;k<n && k<pool.length;k++){ plate.push(pool[(rot[sl]+k)%pool.length]); }
      rot[sl] += 1; day[sl] = [...new Set(plate)];
    }
    if (bridges.length){
      const b = bridges[Math.floor(((d - startDay + 7) % 7)/2)%bridges.length];   // cada puente 2 días seguidos, empezando hoy
      const sl = ALL[b.id].slots.find(x=>x!=="col") || "com";
      day[sl] = [...day[sl], b.id];
    }
    menu[d] = day;
  }
  return menu;
}
function weekTotals(w){
  const t={fibra:0,prot:0,hierro:0,calcio:0,vitA:0}; let days=0, meals=0, eaten=new Set(), ultra=0;
  for (let d=0; d<7; d++){ const log=w?.log?.[d]||{}; const ks=Object.keys(log); if(ks.length) days++; meals+=ks.length;
    ks.forEach(sl=>{ const f=log[sl]==="full"?1:log[sl]==="part"?.5:0; if(!f) return;
      (w.menu?.[d]?.[sl]||[]).forEach(id=>{ if(!ALL[id]) return; eaten.add(id); const n=NUM(id); for(const k in t) t[k]+=n[k]*f; if(ALL[id].up) ultra+=f; }); }); }
  return {t, days, meals, eaten:[...eaten], ultra};
}
function baseline(p){ // un día típico con solo sus alimentos seguros iniciales
  const ids = p.initialSafe||[]; const t={fibra:0,prot:0,hierro:0,calcio:0,vitA:0};
  if(!ids.length) return t; ids.forEach(id=>{const n=NUM(id); for(const k in t) t[k]+=n[k];});
  for(const k in t) t[k] = t[k]/ids.length*1.75; return t;   // por comida (≈1.75 alimentos por plato)
}

async function loadWeek(){
  S.weekId = ymd(mondayOf(new Date()));

  S.week = w; S.sel = todayIdx();
  S.weeks = await DB.listWeeks(S.user.uid);
}

async function logMeal(sl,v){

function viewAvance(){
  const cur=weekTotals(S.week), base=baseline(S.profile);

  const newThisWeek=wkNew.length, triedThisWeek=wkNew.filter(id=>status(id)!=="no").length;
  const rows=Object.keys(NUTS).map(k=>{ const c=cur.meals?cur.t[k]/cur.meals:0, b=base[k]; return {k,c,b,d:b?Math.round((c-b)/b*100):(c>0?null:0)}; }).sort((a,b)=>(b.d??999)-(a.d??999));
  const maxC=Math.max(...rows.map(r=>r.c),.01);
  const wins=BRIDGES.filter(b=>status(b.id)==="ok").map(b=>({b,from:b.from.find(id=>(S.profile.initialSafe||[]).includes(id))})).filter(x=>x.from);

      <p>${okNow>startCount?`¡${kid()} ya acepta ${okNow-startCount} alimento${okNow-startCount>1?"s":""} más que al empezar! 🎉`:`Este número sube cada vez que marcas <b>“Todo”</b> en un alimento nuevo. Si marcas “Un poco”, queda como <b>probando</b> y vuelve a aparecer.`}</p>
      <div class="weeknew"><span>Esta semana</span><b>${newThisWeek} alimento${newThisWeek===1?"":"s"} nuevo${newThisWeek===1?"":"s"} en su menú · ${triedThisWeek} ya probado${triedThisWeek===1?"":"s"}</b></div></div>
    <div class="card"><h2>¿Su plato está mejorando?</h2><p class="lead">${enough?`Comparamos <b>lo que marcaste que comió</b> esta semana con lo que comía antes de empezar (solo sus alimentos de siempre). Se actualiza cada vez que marcas Todo, Un poco o Nada.`:`Marca al menos 3 comidas en “Mi semana” (Todo, Un poco o Nada) y aquí verás si su plato tiene más hierro, fibra, proteína… que antes de empezar.`}</p>
      <div class="nutri">${rows.map(r=>`<div class="nrow"><div class="ic">${NUTS[r.k].e}</div><div><b>${NUTS[r.k].n}</b><small>${NUTS[r.k].why}</small><div class="track"><i style="width:${Math.round(r.c/maxC*100)}%"></i></div></div>
        <div class="delta ${!enough||r.d===0?"flat":""}">${!enough?"–":r.d===null?"¡Nuevo!":r.d>0?"↑ "+r.d+"% más":r.d===0?"=":"↓ "+Math.abs(r.d)+"% menos"}</div></div>`).join("")}</div></div>
    <div class="card"><h2>Cambios que lograste</h2><p class="lead" style="margin-bottom:6px">Lo que antes comía → lo que ahora también acepta.</p>
      ${wins.length?wins.map(x=>`<div class="swap"><div class="f from"><span>${ALL[x.from].e}</span>${esc(ALL[x.from].n)}</div><div class="arrow">→</div><div class="f"><span>${x.b.e}</span>${esc(ALL[x.b.id].n)}</div><div class="gain">+ ${(x.b.nut||[]).filter(n=>NUTS[n]).map(n=>NUTS[n].n).slice(0,2).join(", ")||"variedad"}</div></div>`).join(""):`<p class="empty">Aquí aparecerá cada alimento nuevo que ${kid()} acepte. ¡El primero puede ser esta semana!</p>`}</div>

  </section>`;
}

}
function celebrate(id){
  const f=ALL[id], el=$("#celebrate");
  el.innerHTML=`<div class="box"><div class="big">🎉</div><h2 style="margin:6px 0">¡${kid()} se comió ${esc(f.n.toLowerCase())}!</h2><p class="lead">Un alimento nuevo en su lista.</p>
    <div class="plus" style="justify-content:center">${(f.g||[]).filter(n=>NUTS[n]).map(n=>`<span>+ ${NUTS[n].n}</span>`).join("")}</div><button class="btn" id="celOk">¡Genial!</button></div>`;
  el.classList.add("show"); $("#celOk").onclick=()=>el.classList.remove("show");
}

/* ---------- Render ---------- */
const ICONS = {
  hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  avance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  mapa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>',
};
function render(){
  if(S.view==="loading"){ root.className="app"; root.innerHTML='<div class="loader">Cargando…</div>'; return; }
  if(S.view==="auth"){ root.className="app"; root.innerHTML=viewAuth(); mountAuth(); return; }
  if(S.view==="paywall"){ root.className="app"; root.innerHTML=viewPaywall(); mountPaywall(); return; }
  if(S.view==="onboarding"){ root.className="app"; root.innerHTML=`<main>${viewOnboarding()}</main>`; mountOnboarding(); return; }
  root.className="app withnav";
  root.innerHTML = `<header class="bar"><div class="logo">mi mapa<b>.</b></div><button class="kid" data-tab="mapa"><i>${kid().charAt(0).toUpperCase()}</i>${kid()}</button></header>
    <main>${S.tab==="hoy"?viewHoy():S.tab==="avance"?viewAvance():viewMapa()}</main>
    <nav class="tabs"><div class="in">${[["hoy","Mi semana"],["avance","Su avance"],["mapa","Sus alimentos"]].map(([t,l])=>`<button data-tab="${t}" class="${S.tab===t?"on":""}">${ICONS[t]}${l}</button>`).join("")}</div></nav>`;
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;window.scrollTo(0,0);render();});
  root.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{S.sel=+b.dataset.day;render();});
  root.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>logMeal(b.dataset.log,b.dataset.v));
  root.querySelectorAll("[data-chg]").forEach(b=>b.onclick=()=>changeSheet(b.dataset.chg));
  root.querySelectorAll("[data-how]").forEach(b=>b.onclick=()=>howSheet(b.dataset.how));
  root.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>foodSheet(b.dataset.food));
  const sb=$("#shopBtn"); if(sb) sb.onclick=shopSheet;
  const as=$("#addSafe"); if(as) as.onclick=addSafeSheet;
  const rg=$("#regen"); if(rg) rg.onclick=async()=>{ S.week={v:2,menu:genMenu(S.profile),log:S.week.log||{},createdAt:Date.now()}; try{await DB.saveWeek(S.user.uid,S.weekId,S.week);}catch(e){} S.tab="hoy"; render(); toast("Menú nuevo listo ✓"); };
  const lo=$("#logout"); if(lo) lo.onclick=()=>DB.signOut();
}
</script>
</body>
</html>
